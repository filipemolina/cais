# Fixture stack for the README screenshots and the demo recording. Shaped like
# a real homelab: three profiles, *arr apps, media servers, and the plumbing
# underneath. Ports sit in the 14000+ range so they collide with nothing.

name: homelab

services:
  # --- media -------------------------------------------------------------
  navidrome:
    image: deluan/navidrome:latest
    profiles: ["media"]
    ports:
      - "14533:4533"
    environment:
      ND_LOGLEVEL: info
    volumes:
      - navidrome-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4533/ping"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  audiobookshelf:
    image: ghcr.io/advplyr/audiobookshelf:latest
    profiles: ["media"]
    ports:
      - "14378:80"
    volumes:
      - abs-config:/config
      - abs-metadata:/metadata
    restart: unless-stopped

  kavita:
    image: lscr.io/linuxserver/kavita:latest
    profiles: ["media"]
    ports:
      - "14230:5000"
    environment:
      PUID: 1000
      PGID: 1000
      TZ: Europe/Lisbon
    volumes:
      - kavita-config:/config
    restart: unless-stopped

  # --- downloads ---------------------------------------------------------
  sonarr:
    image: ghcr.io/hotio/sonarr:latest
    profiles: ["downloads"]
    ports:
      - "14989:8989"
    environment:
      PUID: 1000
      PGID: 1000
      TZ: Europe/Lisbon
    volumes:
      - sonarr-config:/config
    depends_on:
      - prowlarr
    restart: unless-stopped

  radarr:
    image: lscr.io/linuxserver/radarr:latest
    profiles: ["downloads"]
    ports:
      - "14878:7878"
    environment:
      PUID: 1000
      PGID: 1000
      TZ: Europe/Lisbon
    volumes:
      - radarr-config:/config
    depends_on:
      - prowlarr
    restart: unless-stopped

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    profiles: ["downloads"]
    ports:
      - "14696:9696"
    environment:
      PUID: 1000
      PGID: 1000
      TZ: Europe/Lisbon
    volumes:
      - prowlarr-config:/config
    restart: unless-stopped

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    profiles: ["downloads"]
    ports:
      - "14080:8080"
    environment:
      PUID: 1000
      PGID: 1000
      TZ: Europe/Lisbon
      WEBUI_PORT: 8080
    volumes:
      - qbit-config:/config
    restart: unless-stopped

  # --- infra -------------------------------------------------------------
  proxy:
    image: traefik:3.6
    profiles: ["infra"]
    command: ["--providers.docker=false", "--entrypoints.web.address=:80"]
    ports:
      - "14000:80"
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    profiles: ["infra"]
    environment:
      POSTGRES_PASSWORD: demo
      POSTGRES_DB: homelab
    volumes:
      - db-data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  cache:
    image: redis:7-alpine
    profiles: ["infra"]
    command: ["redis-server", "--save", "60", "1"]
    restart: unless-stopped

volumes:
  navidrome-data:
  abs-config:
  abs-metadata:
  kavita-config:
  sonarr-config:
  radarr-config:
  prowlarr-config:
  qbit-config:
  db-data:
