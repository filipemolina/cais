# Fixture stack for the README screenshots and the demo recording. Shaped like
# a real homelab: three profiles, media and utility apps, and the plumbing
# underneath. Ports sit in the 14000+ range so they collide with nothing.

name: homelab

services:
  # --- media -------------------------------------------------------------
  navidrome:
    image: deluan/navidrome:latest
    profiles: ["media"]
    ports:
      - "14533:4533"
    environment:
      ND_LOGLEVEL: info
    volumes:
      - navidrome-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4533/ping"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  audiobookshelf:
    image: ghcr.io/advplyr/audiobookshelf:latest
    profiles: ["media"]
    ports:
      - "14378:80"
    volumes:
      - abs-config:/config
      - abs-metadata:/metadata
    restart: unless-stopped

  kavita:
    image: lscr.io/linuxserver/kavita:latest
    profiles: ["media"]
    ports:
      - "14230:5000"
    environment:
      PUID: 1000
      PGID: 1000
      TZ: Europe/Lisbon
    volumes:
      - kavita-config:/config
    restart: unless-stopped

  # --- home management ---------------------------------------------------
  homeassistant:
    image: homeassistant/home-assistant:stable
    profiles: ["home"]
    ports:
      - "14123:8123"
    environment:
      TZ: Europe/Lisbon
    volumes:
      - ha-config:/config
    restart: unless-stopped

  paperless:
    image: ghcr.io/paperless-ngx/paperless-ngx:latest
    profiles: ["home"]
    ports:
      - "14808:8000"
    environment:
      PAPERLESS_TIME_ZONE: Europe/Lisbon
      PAPERLESS_SECRET_KEY: stack-stitcher-demo-secret
      PAPERLESS_REDIS: redis://cache:6379
      PAPERLESS_DBENGINE: postgresql
      PAPERLESS_DBHOST: db
      PAPERLESS_DBPORT: "5432"
      PAPERLESS_DBUSER: postgres
      PAPERLESS_DBPASS: demo
      PAPERLESS_DBNAME: homelab
    volumes:
      - paperless-data:/data
    # No depends_on here on purpose: db and cache live in the "infra"
    # profile, and compose rejects a profile-scoped `up` whose service
    # depends on a service outside the selected profiles ("depends on
    # undefined service"). The demo pre-starts every profile, so paperless
    # finds postgres and redis already running.
    restart: unless-stopped

  calibre:
    image: lscr.io/linuxserver/calibre:latest
    profiles: ["home"]
    ports:
      - "14809:8083"
    environment:
      PUID: 1000
      PGID: 1000
      TZ: Europe/Lisbon
    volumes:
      - calibre-config:/config
      - calibre-books:/books
    restart: unless-stopped

  # --- infra -------------------------------------------------------------
  proxy:
    image: traefik:3.6
    profiles: ["infra"]
    command: ["--providers.docker=false", "--entrypoints.web.address=:80"]
    ports:
      - "14000:80"
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    profiles: ["infra"]
    environment:
      POSTGRES_PASSWORD: demo
      POSTGRES_DB: homelab
    volumes:
      - db-data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  cache:
    image: redis:7-alpine
    profiles: ["infra"]
    command: ["redis-server", "--save", "60", "1"]
    restart: unless-stopped

volumes:
  navidrome-data:
  abs-config:
  abs-metadata:
  kavita-config:
  ha-config:
  paperless-data:
  calibre-config:
  calibre-books:
  db-data:
